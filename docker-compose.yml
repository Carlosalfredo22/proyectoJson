version: '3.8'

services:
  sistema-escolar:
    build: .
    ports:
      - "3000:3000"
    command: npm run dev 
    # ¡NUEVO! Forzamos a que el sistema detecte los cambios en Windows
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/uploads:/app/public/uploads
      - ./database.sqlite:/app/database.sqlite
    restart: always